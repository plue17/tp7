name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y libasound2-dev gcc-aarch64-linux-gnu libasound2-dev:arm64

      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o tp7-linux-amd64 ./cmd/tp7

      - name: Build linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "1"
          CC: aarch64-linux-gnu-gcc
        run: go build -trimpath -ldflags="-s -w" -o tp7-linux-arm64 ./cmd/tp7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tp7-linux-amd64
            tp7-linux-arm64
